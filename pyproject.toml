[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilien"
version = "0.1.0"
description = "Évalue le risque d'hameçonnage d'un lien : âge du domaine, redirections, certificat, usurpation de marque."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kabir ADEMON" }]
dependencies = ["requests>=2.31", "tldextract>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vigilien = "vigilien.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
